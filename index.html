<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/flc-logo.webp" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FLC Hineni" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hineni</title>
    <!-- Outfit — FL Admin Portal UI typeface (DESIGN-new.md). Self-hosted
         variable font (one ~32KB file covers weights 100-900): no third-party
         round-trips, precached by the service worker, preloaded so text
         renders in the right face on first paint. @font-face lives in
         src/index.css. -->
    <link rel="preload" href="/fonts/outfit-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Restore persisted theme before React mounts (light | dark | system). -->
    <script>
      (function () {
        var key = 'flc-theme';
        var pref = localStorage.getItem(key);
        if (pref !== 'dark' && pref !== 'light' && pref !== 'system') pref = 'light';
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        var meta = document.querySelector('meta[name="theme-color"][data-flc-theme]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          meta.setAttribute('data-flc-theme', '');
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', dark ? '#0F1114' : '#EEF1F5');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
